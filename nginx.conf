server {
  listen 6663;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location /api.php {
    proxy_pass https://www.glivestreaming.com;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    proxy_ssl_server_name on;
    proxy_ssl_name www.glivestreaming.com;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host www.glivestreaming.com;
    proxy_set_header User-Agent "yaak";
    proxy_set_header Accept "*/*";
  }

  location = /h5link {
    proxy_pass https://www.glivestreaming.com/api.php?action=geth5link&ip=$remote_addr&$args;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    proxy_ssl_server_name on;
    proxy_ssl_name www.glivestreaming.com;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_set_header Host www.glivestreaming.com;
    proxy_set_header User-Agent "yaak";
    proxy_set_header Accept "*/*";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
